{% load static %}

<section class="hero">
  <video autoplay muted loop playsinline class="hero-video">
    <source src="{% static 'videos/videoshome.mp4' %}" type="video/mp4">
  </video>

  <div class="hero-overlay">
    <div class="container">
      <div class="hero-content">

        <h1 class="hero-title">
          <span>Reduza Custos</span>
          <span>Economize Tempo</span>
          <span id="typed"></span>

        </h1>

        <div class="hero-actions">
          <a href="{% url 'cadastro' %}" class="button button-primary">
            Cadastre-se
          </a>

          <a href="{% url 'login' %}" class="button button-secondary">
            Entrar
          </a>
        </div>

      </div>
    </div>
  </div>
</section>
